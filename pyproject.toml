[project]
name = "rag-playlist"
version = "0.1.0"
description = "Hands-on code and notes for the CampusX LangChain / RAG playlist"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-text-splitters",
    # LLM / embedding providers
    "langchain-openai",
    "langchain-anthropic",
    "langchain-huggingface",
    # Vector stores
    "chromadb",
    "faiss-cpu",
    # Loaders
    "pypdf",
    "beautifulsoup4",
    "youtube-transcript-api",
    # Agentic RAG (videos 7-9)
    "langgraph",
    "tavily-python",
    # Utilities
    "python-dotenv",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_playlist"]
